name: fork PR tests

# Runs the Go tests the pushed diff reaches. Pull requests run no tests.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fork-pr-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: go test (packages the diff reaches)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # The whole history, since the package selection diffs from the merge base.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Test the packages the diff reaches
        env:
          # A workflow_dispatch run has no before SHA, and a new branch reports all zeros.
          BASE_SHA: ${{ github.event.before }}
        run: |
          base=$BASE_SHA
          case "$base" in ""|0000000000000000000000000000000000000000) base=HEAD^ ;; esac
          selected=$(scripts/fork-pr-test-packages.sh "$base" HEAD)
          if [ -z "$selected" ]; then
            echo "::notice::The diff reaches no Go package."
            exit 0
          fi
          echo "$selected"
          mapfile -t packages <<<"$selected"
          go test -race "${packages[@]}"
