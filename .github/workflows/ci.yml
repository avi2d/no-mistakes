name: CI

on:
  pull_request:
    branches:
      - main
    # Never create a run for a release-please PR. GITHUB_TOKEN-opened PRs land in
    # action_required and never start; excluding the exact release-output set means
    # no run is created at all. push/tag/release triggers are unaffected.
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Format check
        run: |
          output=$(gofmt -l .)
          if [ -n "$output" ]; then
            echo "Files not formatted:"
            echo "$output"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

  test-linux:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test on Linux
        run: go test -race ./...

      - name: Build
        run: go build ./cmd/no-mistakes

  # Every shard below is one matrix row: `packages` lists its packages, or
  # `exclude` makes it the `go list ./...` remainder; `run` and `skip` split one
  # package's tests by name. The workflow tests resolve every row and fail
  # unless each test lands in exactly one shard per operating system.
  test-macos:
    name: test (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: macos-1
            packages: ./internal/pipeline/steps/... ./internal/cli ./internal/scm/forgejo ./internal/scm/gitlab ./internal/db
          - shard: macos-2
            exclude: '/internal/(pipeline/steps(/.*)?|cli|scm/forgejo|scm/gitlab|db)$'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test on macOS
        env:
          NM_CI_PACKAGES: ${{ matrix.packages }}
          NM_CI_EXCLUDE: ${{ matrix.exclude }}
        run: |
          if [ -n "$NM_CI_EXCLUDE" ]; then
            pkgs=$(go list ./... | grep -Ev "$NM_CI_EXCLUDE")
          else
            pkgs=$NM_CI_PACKAGES
          fi
          go test -race $pkgs

      - name: Build
        run: go build ./cmd/no-mistakes

  # The Windows leg is process-spawn bound: git-backed packages cost ~10x their
  # Linux time (internal/git 5.7s -> 53s, internal/branchsync 31s -> 415s), so
  # the slowest packages are split by test name across shards. Each row's go
  # test -timeout stays well inside timeout-minutes so a hang dumps goroutines
  # instead of ending in an evidence-free job cancellation.
  test-windows-steps:
    name: test (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: windows-steps-1
            packages: ./internal/pipeline/steps/...
            run: '^Test[A-D]'
            timeout: 15m
          - shard: windows-steps-2
            packages: ./internal/pipeline/steps/...
            run: '^Test([E-O]|P[^u])'
            timeout: 15m
          - shard: windows-steps-3
            packages: ./internal/pipeline/steps/...
            skip: '^Test([A-O]|P[^u])'
            timeout: 15m
    runs-on: windows-latest
    timeout-minutes: 40
    steps: &windows-test-steps
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Defender real-time scanning taxes every git.exe spawn and every file the
      # temp repos create. The runner is disposable and runs nothing else, so
      # excluding the trees this job creates is safe. Best effort on purpose: a
      # runner image without the Defender cmdlets must not fail CI.
      - name: Exclude CI build and test trees from Defender scanning
        shell: pwsh
        run: |
          try {
            $paths = @(
              $env:GITHUB_WORKSPACE,
              $env:RUNNER_TEMP,
              $env:TEMP,
              (go env GOCACHE),
              (go env GOMODCACHE),
              (go env GOROOT)
            ) | Where-Object { $_ } | Sort-Object -Unique
            Add-MpPreference -ExclusionPath $paths -ErrorAction Stop
            Add-MpPreference -ExclusionProcess 'go.exe', 'git.exe' -ErrorAction Stop
            Write-Host "Defender exclusions added for: $($paths -join ', ')"
          } catch {
            Write-Host "::warning::Defender exclusions unavailable, Windows tests run untuned: $_"
          }

      - name: Test on Windows
        shell: pwsh
        env:
          NM_CI_PACKAGES: ${{ matrix.packages }}
          NM_CI_EXCLUDE: ${{ matrix.exclude }}
          NM_CI_RUN: ${{ matrix.run }}
          NM_CI_SKIP: ${{ matrix.skip }}
          NM_CI_TIMEOUT: ${{ matrix.timeout }}
        run: |
          if ($env:NM_CI_EXCLUDE) {
            $pkgs = go list ./... | Where-Object { $_ -notmatch $env:NM_CI_EXCLUDE }
          } else {
            $pkgs = -split $env:NM_CI_PACKAGES
          }
          # go test with no packages silently tests the current directory.
          if (-not $pkgs) { throw "shard resolved no packages" }
          $filters = @()
          if ($env:NM_CI_RUN) { $filters += "-run=$env:NM_CI_RUN" }
          if ($env:NM_CI_SKIP) { $filters += "-skip=$env:NM_CI_SKIP" }
          # Recording a cacheable result re-stats every file the tests touched,
          # which on Windows ran for minutes after the tests themselves passed.
          go test -v -count=1 "-timeout=$env:NM_CI_TIMEOUT" @filters @pkgs

      - name: Build
        run: go build ./cmd/no-mistakes

  test-windows-git:
    name: test (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: windows-git-1
            packages: ./internal/branchsync
            run: '^Test([A-Q]|Recover[A-K])'
            timeout: 15m
          - shard: windows-git-2
            packages: ./internal/branchsync
            skip: '^Test([A-Q]|Recover[A-K])'
            timeout: 15m
          - shard: windows-git-3
            packages: ./internal/daemon
            timeout: 15m
          - shard: windows-git-4
            packages: ./internal/eval ./internal/gate ./internal/git ./internal/evidence
            timeout: 15m
    runs-on: windows-latest
    timeout-minutes: 40
    steps: *windows-test-steps

  test-windows-core:
    name: test (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: windows-core-1
            packages: ./internal/cli
            run: '^Test(Axi[R-Z]|H|[S-Z])'
            timeout: 15m
          - shard: windows-core-2
            packages: ./internal/cli
            skip: '^Test(Axi[R-Z]|H|[S-Z])'
            timeout: 15m
          - shard: windows-core-3
            exclude: '/internal/(cli|git|branchsync|gate|evidence|daemon|eval|pipeline/steps(/.*)?)$'
            timeout: 15m
    runs-on: windows-latest
    timeout-minutes: 40
    steps: *windows-test-steps

  # Branch protection requires these check names, one per shard group.
  test-gate:
    name: test (${{ matrix.group }})
    needs: [test-macos, test-windows-core, test-windows-git, test-windows-steps]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: macos-latest
            job: test-macos
          - group: windows-core
            job: test-windows-core
          - group: windows-git
            job: test-windows-git
          - group: windows-steps
            job: test-windows-steps
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard in the group to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
          JOB: ${{ matrix.job }}
        run: |
          result=$(jq -r --arg job "$JOB" '.[$job].result' <<<"$NEEDS")
          echo "$JOB: $result"
          test "$result" = success

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The e2e suite drives the real no-mistakes binary against a fake
      # agent through `git push -> daemon -> pipeline -> push to upstream`
      # for claude, codex, grok, and opencode. It builds the binary itself, so
      # no separate build step is needed. Linux-only for now: opencode's
      # ephemeral HTTP server picks up unused ports via :0, which is
      # fine on Linux runners but flakes on Windows agent harnesses.
      - name: End-to-end suite
        run: make e2e
