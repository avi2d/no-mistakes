name: stall event repro

on:
  push:
    branches:
      - fm/no-mistakes-27-windows-stall-event

permissions:
  contents: read

jobs:
  stress:
    name: stall event under load (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build the race-instrumented pipeline test binary
        run: go test -race -c -o "$RUNNER_TEMP/pipeline.test" ./internal/pipeline

      - name: Run the stall tests in parallel copies so each loads the others
        working-directory: internal/pipeline
        run: |
          copies=$(( $(nproc) * 3 ))
          pids=()
          for i in $(seq 1 "$copies"); do
            "$RUNNER_TEMP/pipeline.test" -test.run '^TestExecutor_(SilentAgentIsRecordedAsStalledUntilItSpeaks|StallClearsWhenTheTurnEndsSilent)$' -test.count=60 > "$RUNNER_TEMP/copy-$i.log" 2>&1 &
            pids+=($!)
          done
          failed=0
          for i in "${!pids[@]}"; do
            if ! wait "${pids[$i]}"; then
              failed=$((failed + 1))
              grep -h -B2 -A4 -- '--- FAIL' "$RUNNER_TEMP/copy-$((i + 1)).log" | head -40 || tail -40 "$RUNNER_TEMP/copy-$((i + 1)).log"
            fi
          done
          fails=$(cat "$RUNNER_TEMP"/copy-*.log | grep -c -- '--- FAIL' || true)
          passes=$(cat "$RUNNER_TEMP"/copy-*.log | grep -c -- '--- PASS' || true)
          echo "copies=$copies failed_copies=$failed test_fails=$fails test_passes=$passes"
          [ "$failed" -eq 0 ]
