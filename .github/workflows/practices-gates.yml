name: practices gates

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md

permissions:
  contents: read

concurrency:
  group: practices-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The head, not GitHub's merge ref, so the title and the range match the pushed commits.
      # The whole history, since the secrets range starts at the base branch.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: lint the pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bunx --package @avi2dg/checks@0.65.1 checks-commit-title
      - name: scan the pull request range for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bunx --package @avi2dg/checks@0.65.1 checks-secrets "$BASE_SHA" HEAD
